<!-- Flat cadence always (never speeds up for TRANSITIONING — that piled extra requests onto the
     speaker at the exact moment, track start, it's busiest fetching/decoding audio and caused real
     stutter). now_playing() is 2 live, uncached SOAP calls straight to the coordinator every poll,
     for as long as this bar is on screen, so the interval is kept modest even at its normal rate. -->
<footer id="player" class="glass player" hx-get="/player" hx-trigger="refresh from:body, every 5s" hx-swap="outerHTML" hx-disinherit="hx-swap">
  {% if st and st.title %}
  <button class="player__open" hx-get="/now" hx-target="#detail" aria-label="Now playing">
    <span class="player__art">{% if st.cover %}<img src="/cover/{{ st.cover }}?size=100" alt="">{% endif %}</span>
  </button>
  <div class="player__meta">
    <button class="player__title" hx-get="/now" hx-target="#detail">{{ st.title }}</button>
    <div class="player__sub"><span class="artist">{{ st.artist }}</span>{% if room %}<span class="dot">·</span><button class="room" hx-get="/speakers" hx-target="#detail">{{ room }}</button>{% endif %}</div>
  </div>
  <div class="transport transport--mini">
    {% if st.song %}<button class="heart{% if st.starred %} on{% endif %}" hx-post="/star" hx-swap="none" aria-label="Favourite">{{ "♥︎" if st.starred else "♡︎" }}</button>{% endif %}
    <button hx-post="/transport/prev" hx-swap="none" aria-label="Previous">⏮︎</button>
    <button class="big" hx-post="/transport/toggle" hx-swap="none" aria-label="Play or pause">{% if st.state == "TRANSITIONING" %}<i class="spin"></i>{% elif st.state == "PLAYING" %}⏸︎{% else %}▶︎{% endif %}</button>
    <button hx-post="/transport/next" hx-swap="none" aria-label="Next">⏭︎</button>
  </div>
  {% else %}
  <span class="player__art"></span>
  <div class="player__meta">
    <div class="player__title">Nothing playing</div>
    <div class="player__sub">{% if room %}<button class="room" hx-get="/speakers" hx-target="#detail">{{ room }}</button>{% else %}Pick an album{% endif %}</div>
  </div>
  {% endif %}
</footer>
