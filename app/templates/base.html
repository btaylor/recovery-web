<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <!-- Installable web app: Add to Home Screen (iOS/iPadOS) or Add to Dock (Safari, macOS 14+) -->
  <link rel="manifest" href="{{ url_for('main.manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Play">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}Play{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    // iPadOS 26's windowed multitasking adds a title bar that env(safe-area-inset-top) doesn't
    // account for (a WebKit gap with no public API to detect the window mode directly), so top
    // chrome can sit under it. iPadOS reports itself as desktop Safari (navigator.platform is
    // "MacIntel", same as a real Mac) but is still touch-capable, which a Mac never is — the
    // standard way to tell the two apart since iOS 13. Runs before paint to avoid a layout flash.
    if (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) {
      document.documentElement.classList.add("ipados");
    }
  </script>
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
</head>
<body>
  {% block content %}{% endblock %}
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="{{ url_for('static', filename='js/toast.js') }}" defer></script>
</body>
</html>
