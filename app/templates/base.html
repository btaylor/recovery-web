<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <!-- Installable web app: Add to Home Screen (iOS/iPadOS) or Add to Dock (Safari, macOS 14+) -->
  <link rel="manifest" href="{{ url_for('main.manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Play">
  <!-- Launch splash for Home Screen launches; iOS picks the one matching the device's screen size -->
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-1290x2796.png') }}" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-1179x2556.png') }}" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-1284x2778.png') }}" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-1170x2532.png') }}" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-1125x2436.png') }}" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-828x1792.png') }}" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-750x1334.png') }}" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-1640x2360.png') }}" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-2360x1640.png') }}" media="(device-width: 1180px) and (device-height: 820px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-1668x2388.png') }}" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-2388x1668.png') }}" media="(device-width: 1194px) and (device-height: 834px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-2048x2732.png') }}" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-2732x2048.png') }}" media="(device-width: 1366px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-1488x2266.png') }}" media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-2266x1488.png') }}" media="(device-width: 1133px) and (device-height: 744px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-1620x2160.png') }}" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='splash/launch-2160x1620.png') }}" media="(device-width: 1080px) and (device-height: 810px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}Play{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    // iPadOS 26's windowed multitasking adds a title bar that env(safe-area-inset-top) doesn't
    // account for (a WebKit gap with no public API to detect the window mode directly), so top
    // chrome can sit under it. iPadOS reports itself as desktop Safari (navigator.platform is
    // "MacIntel", same as a real Mac) but is still touch-capable, which a Mac never is — the
    // standard way to tell the two apart since iOS 13. Runs before paint to avoid a layout flash.
    if (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) {
      document.documentElement.classList.add("ipados");
    }
  </script>
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
</head>
<body>
  {% block content %}{% endblock %}
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="{{ url_for('static', filename='js/toast.js') }}" defer></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
