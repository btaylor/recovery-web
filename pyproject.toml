[project]
name = "house-music"
version = "0.2.2"
description = "Album-centric Navidrome front-end that plays to Sonos via SoCo"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "aiohttp>=3.9",  # imported directly for error handling (also a py-opensonic dependency)
    "py-opensonic>=10.4",
    "soco>=0.30",
    "gunicorn>=25.1",  # --no-control-socket (used by the Dockerfile) arrived in 25.1
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["app"]

# Without this the installed package (and the Docker image) has no templates, CSS or JS.
[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*", "static/js/*", "static/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
